<!DOCTYPE html>
<html>
<head>
    <title>Leaderboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #3e3529;
            color: #000;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        h1 {
            color: #c9a063;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .table-container {
            background-color: #342e24;
            border: 2px solid #1a1611;
            border-radius: 4px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
        }
        
        table {
            border-collapse: collapse;
            width: 100%;
            background-color: #534940;
        }
        
        th, td {
            padding: 8px 12px;
            text-align: left;
            border: 1px solid #2a241d;
        }
        
        th {
            background-color: #4a3f35;
            color: #c9a063;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
        }
        
        td {
            background-color: #534940;
            color: #e0d5c7;
            font-size: 13px;
        }
        
        tr:nth-child(even) td {
            background-color: #5f5347;
        }
        
        tr:hover td {
            background-color: #6b5d4f;
        }
        
        tbody tr {
            transition: background-color 0.15s ease;
        }
        
        .rank-cell {
            font-weight: bold;
            color: #f4e4c1;
            text-align: center;
            width: 60px;
        }
        
        .username-cell {
            color: #ffebb5;
            font-weight: 500;
        }
        
        .pagination {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        
        .pagination button {
            background-color: #4a3f35;
            color: #c9a063;
            border: 2px solid #2a241d;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            border-radius: 3px;
            transition: all 0.2s ease;
        }
        
        .pagination button:hover:not(:disabled) {
            background-color: #5f5347;
            border-color: #c9a063;
        }
        
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .pagination .page-info {
            color: #c9a063;
            font-size: 14px;
            font-weight: bold;
            margin: 0 10px;
        }
        
        .nav-links {
            text-align: center;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .nav-links a {
            color: #c9a063;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid #2a241d;
            padding: 8px 16px;
            border-radius: 3px;
            transition: all 0.2s ease;
        }
        
        .nav-links a:hover {
            background-color: #5f5347;
            border-color: #c9a063;
            color: #ffebb5;
        }
        
        .nav-links a:visited {
            color: #b88a4f;
        }
        
        footer {
            margin-top: 30px;
            text-align: center;
            color: #c9a063;
            font-size: 12px;
            max-width: 800px;
            width: 100%;
        }
        
        footer p {
            margin: 5px 0;
            color: #c9a063;
        }
        
        a {
            color: #bca37d;
            text-decoration: none;
        }
        
        a:hover {
            color: #ffebb5;
            text-decoration: underline;
        }
        
        a:visited {
            color: #b88a4f;
        }
    </style>
</head>
<body>
    <h1>Gielinor Travels - Hiscores</h1>
    
    <div class="nav-links">
        <a href="/">About</a>
        <a href="/privacypolicy">Privacy Policy</a>
    </div>
    
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th class="rank-cell">Rank</th>
                    <th>Username</th>
                    <th>Score</th>
                    <th>Wins</th>
                    <th>Games Played</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                <!-- Leaderboard entries will be populated here -->
            </tbody>
        </table>
    </div>
    <div class="pagination">
        <button id="prev-btn" onclick="previousPage()">« Previous</button>
        <span class="page-info">Page <span id="current-page">1</span> of <span id="total-pages">1</span></span>
        <button id="next-btn" onclick="nextPage()">Next »</button>
    </div>
    <script>
        let allData = [];
        let currentPage = 1;
        const entriesPerPage = 20;
        
        function renderPage() {
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';
            
            const startIndex = (currentPage - 1) * entriesPerPage;
            const endIndex = startIndex + entriesPerPage;
            const pageData = allData.slice(startIndex, endIndex);
            
            if (pageData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5">No entries found</td></tr>';
                return;
            }
            
            pageData.forEach((entry, index) => {
                const row = document.createElement('tr');
                const actualRank = startIndex + index + 1;
                row.innerHTML = `
                    <td class="rank-cell">${actualRank}</td>
                    <td class="username-cell">${entry.username}</td>
                    <td>${entry.score}</td>
                    <td>${entry.wins}</td>
                    <td>${entry.totalGames}</td>
                `;
                tbody.appendChild(row);
            });
            
            updatePaginationControls();
        }
        
        function updatePaginationControls() {
            const totalPages = Math.ceil(allData.length / entriesPerPage);
            document.getElementById('current-page').textContent = currentPage;
            document.getElementById('total-pages').textContent = totalPages;
            
            document.getElementById('prev-btn').disabled = currentPage === 1;
            document.getElementById('next-btn').disabled = currentPage >= totalPages;
        }
        
        function previousPage() {
            if (currentPage > 1) {
                currentPage--;
                renderPage();
            }
        }
        
        function nextPage() {
            const totalPages = Math.ceil(allData.length / entriesPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                renderPage();
            }
        }
        
        // Fetch and populate leaderboard
        async function loadLeaderboard() {
            try {
                const response = await fetch('/leaderboard-json');
                const data = await response.json();
                
                if (Array.isArray(data)) {
                    allData = data;
                    renderPage();
                } else if (data.error) {
                    document.getElementById('leaderboard-body').innerHTML = 
                        `<tr><td colspan="5">Error: ${data.error}</td></tr>`;
                }
            } catch (error) {
                console.error('Failed to load leaderboard:', error);
                document.getElementById('leaderboard-body').innerHTML = 
                    `<tr><td colspan="5">Failed to load leaderboard</td></tr>`;
            }
        }
        
        // Load leaderboard on page load and refresh every 5 seconds
        loadLeaderboard();
        setInterval(loadLeaderboard, 5000);
    </script>
    
    <footer>
        <p>&copy; 2026 <a href="https://github.com/willocon/gielinorTravels">Gielinor Travels</a> | <a href="/leaderboard">Leaderboard</a> | Created by Will O'Connor</p>
    </footer>
</body>
</html>
